name: Backend CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      STOCKBOT_TEST_DATABASE_URL: postgresql+psycopg://stockbot:stockbot@localhost:5432/stockbot_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockbot_test
          POSTGRES_USER: stockbot
          POSTGRES_PASSWORD: stockbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockbot -d stockbot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://stockbot:stockbot@localhost:5432/stockbot_test
      - run: uv run alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://stockbot:stockbot@localhost:5432/stockbot_test
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://stockbot:stockbot@localhost:5432/stockbot_test
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json contracts/openapi.sha256
